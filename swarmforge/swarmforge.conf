# SwarmForge roster (four-pack): specifier -> coder -> refactorer -> architect -> specifier
# One role per line. Fields: role <name> [worktree=<name>|master|none] [mode=task|batch] [preset=<preset-id>]
# Backends are in-process dsh continuable sub-agents (no agent/CLI field; see plan §4.1, decision D3).
# preset= is available for per-role model/tool selection but omitted here to use defaults.
role specifier worktree=master
role coder worktree=coder
role refactorer worktree=refactorer
role architect worktree=architect mode=batch
